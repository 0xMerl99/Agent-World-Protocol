<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent World Protocol — Live Viewer</title>
<link rel="icon" type="image/png" href="../assets/brand/logo-transparent.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
  }

  #game-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  /* HUD Overlay */
  #hud {
    position: absolute;
    top: 12px; left: 12px;
    z-index: 100;
    pointer-events: none;
  }
  #hud > div { pointer-events: auto; }

  .hud-panel {
    background: rgba(10, 10, 26, 0.85);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 8px;
    backdrop-filter: blur(8px);
    font-size: 12px;
    line-height: 1.6;
    min-width: 200px;
  }
  .hud-panel h3 {
    color: #00d4ff;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
    border-bottom: 1px solid rgba(0, 212, 255, 0.2);
    padding-bottom: 4px;
  }
  .hud-stat {
    display: flex;
    justify-content: space-between;
  }
  .hud-stat .label { color: #888; }
  .hud-stat .value { color: #00ff88; font-weight: bold; }

  #agent-list {
    max-height: 200px;
    overflow-y: auto;
  }
  .agent-entry {
    padding: 3px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 11px;
  }
  .agent-entry .name { color: #e0e0e0; }
  .agent-entry .pos { color: #666; }

  #event-log {
    position: absolute;
    bottom: 12px; left: 12px;
    z-index: 100;
    width: 360px;
    max-height: 180px;
    overflow-y: auto;
    pointer-events: auto;
  }
  .event-entry {
    font-size: 11px;
    padding: 2px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .event-entry .tick { color: #555; }
  .event-entry .msg { color: #aaa; }
  .event-entry .speech { color: #fae080; }
  .event-entry .action { color: #00d4ff; }
  .event-entry .build { color: #00ff88; }
  .event-entry .combat { color: #ff6655; }

  /* Connection status */
  #connection-status {
    position: absolute;
    top: 12px; right: 12px;
    z-index: 100;
  }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.connected { background: #00ff88; box-shadow: 0 0 6px #00ff88; }
  .status-dot.disconnected { background: #ff4444; box-shadow: 0 0 6px #ff4444; }
  .status-dot.connecting { background: #fae080; box-shadow: 0 0 6px #fae080; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* Minimap */
  #minimap {
    position: absolute;
    bottom: 12px; right: 12px;
    z-index: 100;
    width: 150px; height: 150px;
    background: rgba(10,10,26,0.9);
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 4px;
    image-rendering: pixelated;
  }
  #minimap-label {
    position: absolute;
    bottom: 164px; right: 12px;
    z-index: 100;
    font-size: 9px;
    color: #5a5a7a;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* World event banner */
  #world-event {
    position: absolute;
    top: 50px; left: 50%;
    transform: translateX(-50%);
    z-index: 150;
    background: rgba(10,10,26,0.9);
    border: 1px solid rgba(255,200,0,0.4);
    border-radius: 6px;
    padding: 8px 20px;
    font-size: 12px;
    color: #ffd700;
    text-align: center;
    display: none;
    pointer-events: none;
    animation: eventPulse 2s infinite;
  }
  #world-event .event-label { font-weight: bold; font-size: 13px; }
  #world-event .event-desc { color: #ccc; font-size: 11px; margin-top: 2px; }
  @keyframes eventPulse { 0%,100% { border-color: rgba(255,200,0,0.4); } 50% { border-color: rgba(255,200,0,0.8); } }

  /* Toast notifications */
  #toast-container {
    position: absolute;
    top: 50px; right: 12px;
    z-index: 200;
    width: 280px;
    pointer-events: none;
  }
  .toast {
    background: rgba(10,10,26,0.92);
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 4px;
    padding: 8px 12px;
    margin-bottom: 6px;
    font-size: 11px;
    color: #d0d0d0;
    animation: toastIn 0.3s ease;
    backdrop-filter: blur(6px);
  }
  .toast.combat { border-color: rgba(255,80,60,0.5); }
  .toast.build { border-color: rgba(0,255,100,0.5); }
  .toast.event { border-color: rgba(255,200,0,0.5); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

  /* Agent tooltip */
  #agent-tooltip {
    position: absolute;
    z-index: 200;
    background: rgba(10,10,26,0.95);
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 11px;
    color: #d0d0d0;
    display: none;
    pointer-events: none;
    min-width: 140px;
  }
  #agent-tooltip h4 { color: #00d4ff; font-size: 12px; margin-bottom: 4px; }
  #agent-tooltip .stat { display: flex; justify-content: space-between; padding: 1px 0; }
  #agent-tooltip .stat .label { color: #888; }
  #agent-tooltip .stat .val { color: #00ff88; }

  /* Sound toggle */
  #sound-toggle {
    position: absolute;
    top: 12px; right: 140px;
    z-index: 100;
    background: rgba(10,10,26,0.85);
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 4px;
    color: #888;
    font-family: inherit;
    font-size: 14px;
    padding: 4px 8px;
    cursor: pointer;
  }
  #sound-toggle.on { color: #00d4ff; }

  /* Controls hint */
  #controls-hint {
    position: absolute;
    bottom: 170px; right: 12px;
    z-index: 100;
    font-size: 10px;
    color: #444;
    text-align: right;
    line-height: 1.8;
  }

  @media (max-width: 768px) {
    .hud-panel { padding: 8px 10px; font-size: 11px; min-width: 0; width: 160px; }
    .hud-panel h3 { font-size: 10px; letter-spacing: 1px; }
    #agent-list { max-height: 120px; }
    #event-log { width: calc(100vw - 24px); left: 12px; right: 12px; bottom: 8px; max-height: 120px; font-size: 10px; }
    #connection-status { font-size: 10px; padding: 6px 10px; }
    #controls-hint { display: none; }
    .event-entry { font-size: 10px; }
    #minimap { width: 100px; height: 100px; }
    #minimap-label { bottom: 114px; }
    #world-event { font-size: 11px; padding: 6px 14px; top: 40px; }
  }

  @media (max-width: 480px) {
    #hud { top: 8px; left: 8px; }
    .hud-panel { width: 130px; padding: 6px 8px; font-size: 9px; margin-bottom: 4px; }
    .hud-panel h3 { font-size: 9px; letter-spacing: 1px; margin-bottom: 3px; padding-bottom: 3px; }
    .hud-stat .label, .hud-stat .value { font-size: 9px; }
    #agent-list { max-height: 80px; }
    .agent-entry { font-size: 9px; }
    #connection-status { top: 8px; right: 8px; padding: 4px 8px; font-size: 9px; }
    #event-log { left: 8px; right: 8px; bottom: 6px; max-height: 80px; }
    .event-entry { font-size: 9px; padding: 1px 0; }
    #minimap { width: 80px; height: 80px; bottom: 8px; right: 8px; }
    #minimap-label { bottom: 92px; right: 8px; font-size: 8px; }
    #sound-toggle { top: 8px; right: 100px; font-size: 12px; padding: 3px 6px; }
  }

  @media (max-width: 360px) {
    #hud { top: 6px; left: 6px; }
    .hud-panel { width: 110px; padding: 4px 6px; font-size: 8px; }
    .hud-panel h3 { font-size: 8px; }
    #event-log { max-height: 60px; left: 6px; right: 6px; bottom: 6px; }
    #minimap { display: none; }
    #minimap-label { display: none; }
  }
</style>
</head>
<body>

<div id="game-container"></div>

<!-- Toast notifications -->
<div id="toast-container"></div>

<!-- Agent tooltip -->
<div id="agent-tooltip">
  <h4 id="tt-name"></h4>
  <div class="stat"><span class="label">HP</span><span class="val" id="tt-hp"></span></div>
  <div class="stat"><span class="label">Position</span><span class="val" id="tt-pos"></span></div>
  <div class="stat"><span class="label">Level</span><span class="val" id="tt-level"></span></div>
  <div class="stat"><span class="label">Status</span><span class="val" id="tt-status"></span></div>
  <div id="tt-inventory"></div>
</div>

<!-- Sound toggle -->
<button id="sound-toggle" onclick="toggleSound()" title="Toggle sound effects">&#128264;</button>

<!-- World event banner -->
<div id="world-event">
  <div class="event-label" id="event-label"></div>
  <div class="event-desc" id="event-desc"></div>
</div>

<!-- Minimap -->
<span id="minimap-label">MINIMAP</span>
<canvas id="minimap" width="150" height="150"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="hud-panel">
    <h3>Agent World Protocol</h3>
    <div class="hud-stat"><span class="label">Tick</span><span class="value" id="hud-tick">0</span></div>
    <div class="hud-stat"><span class="label">Agents</span><span class="value" id="hud-agents">0</span></div>
    <div class="hud-stat"><span class="label">Zones</span><span class="value" id="hud-zones">0</span></div>
    <div class="hud-stat"><span class="label">Buildings</span><span class="value" id="hud-buildings">0</span></div>
    <div class="hud-stat"><span class="label">Resources</span><span class="value" id="hud-resources">0</span></div>
  </div>
  <div class="hud-panel">
    <h3>Agents Online</h3>
    <div id="agent-list"></div>
  </div>
</div>

<div id="connection-status" class="hud-panel">
  <span class="status-dot connecting" id="status-dot"></span>
  <span id="status-text">Connecting...</span>
</div>

<div id="event-log" class="hud-panel">
  <h3>World Events</h3>
  <div id="events"></div>
</div>

<div id="controls-hint">
  Scroll to zoom · Drag to pan<br>
  Click agent to follow
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
<script>
// ==================== CONFIG ====================
const WS_URL = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host;
const TILE_W = 64;
const TILE_H = 32;
const AGENT_SIZE = 16;

// ==================== ISO HELPERS ====================
function cartToIso(x, y) {
  return {
    x: (x - y) * (TILE_W / 2),
    y: (x + y) * (TILE_H / 2),
  };
}

function isoToCart(isoX, isoY) {
  return {
    x: (isoX / (TILE_W / 2) + isoY / (TILE_H / 2)) / 2,
    y: (isoY / (TILE_H / 2) - isoX / (TILE_W / 2)) / 2,
  };
}

// ==================== MAIN GAME SCENE ====================
class WorldScene extends Phaser.Scene {
  constructor() {
    super('WorldScene');
    this.agentSprites = new Map();
    this.buildingSprites = new Map();
    this.resourceSprites = new Map();
    this.tileSprites = [];
    this.ws = null;
    this.worldData = {
      agents: [],
      zones: [],
      buildings: [],
      tick: 0,
    };
    this.followingAgent = null;
    this.renderedZones = new Set();
  }

  preload() {
    // Ground tilesets: 512x282, 8 cols × 7 rows, cells 64×40
    this.load.spritesheet('ground', '/assets/tiles/ground.png', { frameWidth: 64, frameHeight: 40 });
    // Water tiles: 512x119, 8 cols × 3 rows, cells 64×40
    this.load.spritesheet('water', '/assets/tiles/water.png', { frameWidth: 64, frameHeight: 40 });
    // Road tiles: assume same grid as ground
    this.load.spritesheet('roads', '/assets/tiles/roads.png', { frameWidth: 64, frameHeight: 40 });
    // Farm tiles
    this.load.spritesheet('farm', '/assets/tiles/farm.png', { frameWidth: 64, frameHeight: 40 });
    // Special terrain
    this.load.spritesheet('special', '/assets/tiles/special.png', { frameWidth: 64, frameHeight: 40 });

    // Characters: 512x383, 16 cols × 8 rows, cells 32×48
    this.load.spritesheet('agents', '/assets/characters/agents.png', { frameWidth: 32, frameHeight: 48 });
    // Accessories overlay
    this.load.spritesheet('accessories', '/assets/characters/accessories.png', { frameWidth: 32, frameHeight: 48 });

    // Trees & props: 384x127, 8 cols × 2 rows, cells 48×64
    this.load.spritesheet('trees', '/assets/props/trees.png', { frameWidth: 48, frameHeight: 64 });
    // Object props
    this.load.spritesheet('objects', '/assets/props/objects.png', { frameWidth: 32, frameHeight: 32 });
    // Flowers
    this.load.spritesheet('flowers', '/assets/props/flowers.png', { frameWidth: 16, frameHeight: 16 });

    // Buildings (individual images)
    const buildingTypes = ['home', 'shop', 'vault', 'lab', 'headquarters'];
    for (const type of buildingTypes) {
      for (let lvl = 1; lvl <= 3; lvl++) {
        this.load.image(`${type}_level${lvl}`, `/assets/buildings/${type}_level${lvl}.png`);
      }
    }

    // Effects
    this.load.spritesheet('smoke', '/assets/effects/smoke.png', { frameWidth: 32, frameHeight: 32 });
    this.load.spritesheet('sparkle', '/assets/effects/sparkle.png', { frameWidth: 16, frameHeight: 16 });
    this.load.image('speech_bubble', '/assets/effects/speech_bubble.png');

    // Large features
    this.load.image('large_features', '/assets/features/large.png');
  }

  create() {
    // No more generateTextures() — all assets loaded in preload()

    // Biome-to-ground-row mapping (ground.png has 7 rows, one per biome)
    this.biomeRow = {
      village: 0,
      autumn_town: 1,
      farmland: 2,
      industrial: 3,
      wilderness: 4,
      highlands: 5,
      winter_town: 6,
    };

    // Biome-specific tree frame indices (trees.png: row 0 = big trees, row 1 = small props)
    // Row 0: green tree, autumn tree, yellow tree, pine, snow pine, dead tree, fruit tree, willow
    // Row 1: bush, grass, wheat, sunflower, corn, pumpkin, mushroom, cactus
    this.biomeTrees = {
      village: [0, 7],       // green tree, willow
      autumn_town: [1, 2],   // autumn tree, yellow tree
      farmland: [10, 11],    // wheat, sunflower
      industrial: [5],       // dead tree
      wilderness: [0, 6, 7], // green, fruit, willow
      highlands: [5, 3],     // dead tree, pine
      winter_town: [4, 3],   // snow pine, pine
    };
    this.biomeProps = {
      village: [8, 9],        // bush, grass
      autumn_town: [8, 14],   // bush, mushroom
      farmland: [12, 13],     // corn, pumpkin
      industrial: [],
      wilderness: [8, 9, 14], // bush, grass, mushroom
      highlands: [9],         // grass
      winter_town: [8],       // bush (snowy)
    };

    // Create walk animations for each character variant (8 rows × 4 directions)
    // Row layout: 16 frames per row (4 dirs × 4 frames)
    // S-idle(0) S-walk1(1) S-idle(2) S-walk2(3) W-idle(4) W-walk1(5)...
    const dirNames = ['south', 'west', 'north', 'east'];
    for (let variant = 0; variant < 8; variant++) {
      const rowStart = variant * 16;
      for (let dir = 0; dir < 4; dir++) {
        const base = rowStart + dir * 4;
        const key = `agent_v${variant}_${dirNames[dir]}`;
        // Walk animation: idle, step1, idle, step2
        this.anims.create({
          key: key + '_walk',
          frames: [
            { key: 'agents', frame: base },
            { key: 'agents', frame: base + 1 },
            { key: 'agents', frame: base + 2 },
            { key: 'agents', frame: base + 3 },
          ],
          frameRate: 6,
          repeat: -1,
        });
        // Idle (single frame)
        this.anims.create({
          key: key + '_idle',
          frames: [{ key: 'agents', frame: base }],
          frameRate: 1,
        });
      }
    }

    // Smoke animation
    if (this.textures.exists('smoke')) {
      this.anims.create({
        key: 'smoke_anim',
        frames: this.anims.generateFrameNumbers('smoke', { start: 0, end: 3 }),
        frameRate: 4,
        repeat: -1,
      });
    }

    // Camera setup
    this.cameras.main.setBackgroundColor('#0a0a1a');
    this.cameras.main.setZoom(1.5);

    // Drag to pan
    this.input.on('pointermove', (p) => {
      if (p.isDown && !this.followingAgent) {
        this.cameras.main.scrollX -= (p.x - p.prevPosition.x) / this.cameras.main.zoom;
        this.cameras.main.scrollY -= (p.y - p.prevPosition.y) / this.cameras.main.zoom;
      }
    });

    // Scroll to zoom
    this.input.on('wheel', (pointer, gameObjects, dx, dy) => {
      const zoom = this.cameras.main.zoom;
      const newZoom = Phaser.Math.Clamp(zoom - dy * 0.001, 0.3, 4);
      this.cameras.main.setZoom(newZoom);
    });

    // Mobile pinch-zoom
    let pinchStartDist = 0;
    let pinchStartZoom = 1;
    this.input.on('pointerdown', (pointer) => {
      if (this.input.pointer1.isDown && this.input.pointer2.isDown) {
        const dx = this.input.pointer1.x - this.input.pointer2.x;
        const dy = this.input.pointer1.y - this.input.pointer2.y;
        pinchStartDist = Math.sqrt(dx * dx + dy * dy);
        pinchStartZoom = this.cameras.main.zoom;
      }
    });
    this.input.on('pointermove', () => {
      if (this.input.pointer1.isDown && this.input.pointer2.isDown) {
        const dx = this.input.pointer1.x - this.input.pointer2.x;
        const dy = this.input.pointer1.y - this.input.pointer2.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (pinchStartDist > 0) {
          const newZoom = Phaser.Math.Clamp(pinchStartZoom * (dist / pinchStartDist), 0.3, 4);
          this.cameras.main.setZoom(newZoom);
        }
      }
    });

    // Click to stop following / select agent
    this.input.on('pointerdown', () => {
      // Check if clicked on an agent
      let clickedAgent = false;
      for (const [agentId, sprite] of this.agentSprites) {
        const bounds = sprite.getBounds();
        if (bounds.contains(this.input.activePointer.worldX, this.input.activePointer.worldY)) {
          this.followingAgent = agentId;
          clickedAgent = true;
          break;
        }
      }
      if (!clickedAgent) {
        this.followingAgent = null;
      }
    });

    // Connect to world server
    this.connectToServer();

    // Resource type colors for map rendering
    this.resourceColors = {
      wood:    { fill: 0x8B5E3C, glow: 0xA0724A },
      stone:   { fill: 0x888888, glow: 0xAAAAAA },
      metal:   { fill: 0x7799BB, glow: 0x99BBDD },
      food:    { fill: 0x55AA33, glow: 0x77CC55 },
      crystal: { fill: 0xAA55FF, glow: 0xCC88FF },
      ice:     { fill: 0x88DDFF, glow: 0xBBEEFF },
    };

    // Generate small resource node textures (8x8 diamond icons)
    for (const [type, colors] of Object.entries(this.resourceColors)) {
      const g = this.make.graphics({ add: false });
      // Diamond shape
      g.fillStyle(colors.glow, 0.5);
      g.fillRect(3, 0, 2, 1);
      g.fillRect(2, 1, 4, 1);
      g.fillRect(1, 2, 6, 2);
      g.fillRect(2, 4, 4, 1);
      g.fillRect(3, 5, 2, 1);
      // Inner fill
      g.fillStyle(colors.fill);
      g.fillRect(3, 1, 2, 1);
      g.fillRect(2, 2, 4, 2);
      g.fillRect(3, 4, 2, 1);
      g.generateTexture(`res_${type}`, 8, 6);
      g.destroy();
    }

    // Generate weather particle textures (small runtime textures — the artist sprites are reference-sized)
    this._createWeatherTextures();

    // Track weather emitters per zone
    this.weatherEmitters = new Map();

    // Render initial ground
    this.renderZone('village_center', 'village', 0, 0, 32, 32);

    // Center camera on village center
    const center = cartToIso(16, 16);
    this.cameras.main.centerOn(center.x, center.y);
  }

  connectToServer() {
    setStatus('connecting', 'Connecting...');

    try {
      this.ws = new WebSocket(WS_URL);

      this.ws.onopen = () => {
        // Connect as spectator
        this.ws.send(JSON.stringify({ type: 'spectate' }));
      };

      this.ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          this.handleServerMessage(msg);
        } catch (e) {
          console.error('Parse error:', e);
        }
      };

      this.ws.onclose = () => {
        setStatus('disconnected', 'Disconnected');
        setTimeout(() => this.connectToServer(), 3000);
      };

      this.ws.onerror = () => {
        setStatus('disconnected', 'Connection failed');
      };
    } catch (e) {
      setStatus('disconnected', 'Failed to connect');
      // Spawn demo agents for offline viewing
      setTimeout(() => this.spawnDemoAgents(), 1000);
    }
  }

  handleServerMessage(msg) {
    switch (msg.type) {
      case 'spectate_welcome':
        setStatus('connected', 'Live');
        this.worldData.agents = msg.agents || [];
        this.worldData.zones = msg.zones || [];
        this.worldData.buildings = msg.buildings || [];

        // Render all zones
        for (const zone of this.worldData.zones) {
          this.renderZone(zone.id, zone.biome, zone.originX, zone.originY, zone.width, zone.height);
        }

        // Place all agents, buildings, and resources
        this.updateAgents(this.worldData.agents);
        this.updateBuildings(this.worldData.buildings);
        this.updateResources(msg.resources || []);
        this.updateHUD(msg.worldStats || {});
        updateMinimap(this.worldData.zones, this.worldData.agents, this.worldData.buildings);

        // Show active world event if any
        if (msg.worldStats?.activeEvent) {
          showWorldEvent(msg.worldStats.activeEvent.label, msg.worldStats.activeEvent.description);
        }
        break;

      case 'world_update':
        this.worldData.tick = msg.tick;
        this.worldData.agents = msg.agents || this.worldData.agents;

        this.updateAgents(this.worldData.agents);

        // Process events
        if (msg.events) {
          for (const event of msg.events) {
            this.handleWorldEvent(event);
          }
        }

        // Update HUD + minimap
        document.getElementById('hud-tick').textContent = msg.tick;
        if (msg.stats) {
          document.getElementById('hud-agents').textContent = msg.stats.agentCount;
          document.getElementById('hud-zones').textContent = msg.stats.zoneCount;
        }
        updateMinimap(this.worldData.zones, this.worldData.agents, this.worldData.buildings);
        break;
    }
  }

  handleWorldEvent(event) {
    switch (event.type) {
      case 'agent_spoke':
        addEventLog(`💬 ${event.name}: "${event.message}"`, 'speech', event.tick);
        this.showSpeechBubble(event.agentId, event.message);
        playSound('speak');
        break;
      case 'agent_joined':
        addEventLog(`→ ${event.name} joined the world`, 'action', event.tick);
        playSound('join');
        showToast(`${event.name} joined the world`);
        break;
      case 'agent_left':
        addEventLog(`← Agent left the world`, 'action', event.tick);
        break;
      case 'building_created':
        addEventLog(`🏠 Building created: ${event.buildingType}`, 'build', event.tick);
        this.addBuildingSprite(event.buildingId || 'b_' + Date.now(), event.buildingType, event.x, event.y, event.appearance);
        playSound('build');
        break;
      case 'agent_moved':
        // Handled by updateAgents
        break;
      case 'world_event_start':
        addEventLog(`⚡ ${event.label}: ${event.description}`, 'action', event.tick);
        showWorldEvent(event.label, event.description);
        break;
      case 'world_event_end':
        addEventLog(`⚡ ${event.label} has ended`, 'action', event.tick);
        hideWorldEvent();
        break;
      case 'war_declared':
        addEventLog(`${event.attackerGuild} declared war on ${event.defenderGuild}!`, 'combat', event.tick);
        showToast(`War! ${event.attackerGuild} vs ${event.defenderGuild}`, 'combat');
        playSound('event');
        break;
      case 'war_ended':
        addEventLog(`War ended: ${event.attacker} vs ${event.defender} — ${event.winner} wins!`, 'combat', event.tick);
        showToast(`War ended: ${event.winner} wins!`, 'event');
        break;
      case 'combat_attack':
        addEventLog(`${event.attackerName} attacked ${event.targetName} for ${event.damage} damage`, 'combat', event.tick);
        playSound('combat');
        // Flash the target sprite red
        if (this.agentSprites.has(event.targetId)) {
          const targetSprite = this.agentSprites.get(event.targetId);
          this.tweens.add({ targets: targetSprite.body, tint: 0xff0000, duration: 150, yoyo: true });
        }
        break;
      case 'agent_defeated':
        addEventLog(`${event.defeatedName || event.targetName} was defeated by ${event.attackerName}!`, 'combat', event.tick);
        showToast(`${event.defeatedName || event.targetName} was defeated!`, 'combat');
        break;
      case 'territory_captured':
        addEventLog(`${event.winnerName} captured territory at (${event.tileX},${event.tileY})`, 'action', event.tick);
        break;
      case 'trade_completed':
        addEventLog(`Trade completed between agents`, 'action', event.tick);
        break;
      case 'bounty_completed':
        addEventLog(`Bounty completed: ${event.title || 'unknown'}`, 'action', event.tick);
        break;
      case 'guild_created':
        addEventLog(`Guild created: ${event.guildName || 'unknown'}`, 'action', event.tick);
        break;
    }
  }

  // ==================== RENDERING ====================

  renderZone(zoneId, biome, originX, originY, width, height) {
    if (this.renderedZones.has(zoneId)) return;
    this.renderedZones.add(zoneId);

    const row = this.biomeRow[biome] || 0;
    const baseFrame = row * 8;

    for (let x = originX; x < originX + width; x++) {
      for (let y = originY; y < originY + height; y++) {
        const iso = cartToIso(x, y);

        const hash = ((x * 7 + y * 13) & 0xff);
        const variant = hash % 3;
        const frame = baseFrame + variant;

        const tile = this.add.image(iso.x, iso.y, 'ground', frame);
        tile.setOrigin(0.5, 0.6);
        tile.setScale(1.1);
        tile.setDepth(x + y);

        // Random tree/prop decorations
        if (Math.random() < 0.02 && biome !== 'industrial') {
          this.addDecoration(x, y, biome);
        }
      }
    }

    // Zone label
    const labelPos = cartToIso(originX + width / 2, originY + 1);
    const biomeLabel = biome.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    const label = this.add.text(labelPos.x, labelPos.y - 10, biomeLabel, {
      fontSize: '10px',
      fontFamily: 'Courier New',
      color: 'rgba(255,255,255,0.25)',
      stroke: '#0a0a1a',
      strokeThickness: 1,
    }).setOrigin(0.5).setDepth(originX + originY + 0.1);

    // Spawn biome-specific weather effects for this zone
    this._spawnWeatherForZone(zoneId, biome, originX, originY, width, height);
  }

  addDecoration(tileX, tileY, biome) {
    const iso = cartToIso(tileX, tileY);

    // Decide: tree (tall) or small prop
    const useTree = Math.random() < 0.6;

    if (useTree) {
      const treeFrames = this.biomeTrees[biome] || [0];
      const frame = treeFrames[Math.floor(Math.random() * treeFrames.length)];

      if (this.textures.exists('trees')) {
        const tree = this.add.image(iso.x, iso.y - 20, 'trees', frame);
        tree.setOrigin(0.5, 0.8);
        tree.setDepth(tileX + tileY + 0.5);
      }
    } else {
      const propFrames = this.biomeProps[biome] || [];
      if (propFrames.length > 0 && this.textures.exists('trees')) {
        const frame = propFrames[Math.floor(Math.random() * propFrames.length)];
        const prop = this.add.image(iso.x, iso.y - 4, 'trees', frame);
        prop.setOrigin(0.5, 0.8);
        prop.setDepth(tileX + tileY + 0.3);
        prop.setScale(0.7);
      }
    }
  }

  // ==================== WEATHER EFFECTS ====================

  _createWeatherTextures() {
    // Autumn leaves — 4 small leaf particles in different colors
    const leafColors = [
      { fill: 0xc44a2a, dark: 0x9a3a1a },  // red maple
      { fill: 0xd48030, dark: 0xa46020 },  // orange oak
      { fill: 0xd4b030, dark: 0xa49020 },  // yellow birch
      { fill: 0x8a5030, dark: 0x6a3a1a },  // brown dry
    ];

    leafColors.forEach((c, i) => {
      const g = this.make.graphics({ add: false });
      // Small leaf shape ~8x8
      g.fillStyle(c.fill);
      g.fillRect(2, 1, 4, 2);
      g.fillRect(1, 2, 6, 3);
      g.fillRect(3, 5, 3, 2);
      // Dark edge
      g.fillStyle(c.dark);
      g.fillRect(1, 2, 1, 3);
      g.fillRect(3, 0, 2, 1);
      // Vein
      g.fillStyle(c.dark, 0.5);
      g.fillRect(3, 2, 1, 4);
      g.generateTexture(`leaf_${i}`, 8, 8);
      g.destroy();
    });

    // Snowflakes — 3 sizes
    [
      { key: 'snowflake_s', size: 4, alpha: 0.7 },
      { key: 'snowflake_m', size: 6, alpha: 0.85 },
      { key: 'snowflake_l', size: 8, alpha: 1.0 },
    ].forEach(s => {
      const g = this.make.graphics({ add: false });
      const c = s.size / 2;
      // Crystal shape
      g.fillStyle(0xffffff, s.alpha);
      g.fillRect(c - 0, 0, 1, s.size);       // vertical
      g.fillRect(0, c - 0, s.size, 1);       // horizontal
      // Diagonal arms
      g.fillStyle(0xe0e8f4, s.alpha * 0.8);
      for (let d = 0; d < c; d++) {
        g.fillRect(c - d, c - d, 1, 1);
        g.fillRect(c + d, c - d, 1, 1);
        g.fillRect(c - d, c + d, 1, 1);
        g.fillRect(c + d, c + d, 1, 1);
      }
      // Bright center
      g.fillStyle(0xffffff);
      g.fillRect(c, c, 1, 1);
      g.generateTexture(s.key, s.size + 1, s.size + 1);
      g.destroy();
    });

    // Rain drops — thin diagonal streaks
    const g = this.make.graphics({ add: false });
    g.fillStyle(0xb0c8e8, 0.6);
    // Diagonal line going top-left to bottom-right
    g.fillRect(4, 0, 1, 1);
    g.fillRect(3, 1, 1, 2);
    g.fillRect(2, 3, 1, 2);
    g.fillRect(1, 5, 1, 2);
    g.fillRect(0, 7, 1, 2);
    // Bright highlight
    g.fillStyle(0xd0e0f0, 0.4);
    g.fillRect(3, 2, 1, 1);
    g.fillRect(1, 6, 1, 1);
    g.generateTexture('raindrop', 6, 10);
    g.destroy();

    // Industrial smoke/haze particle
    const g2 = this.make.graphics({ add: false });
    g2.fillStyle(0x8a8a8a, 0.2);
    g2.fillCircle(4, 4, 4);
    g2.fillStyle(0x9a9a9a, 0.1);
    g2.fillCircle(3, 3, 2);
    g2.generateTexture('haze', 9, 9);
    g2.destroy();
  }

  _spawnWeatherForZone(zoneId, biome, originX, originY, width, height) {
    if (this.weatherEmitters.has(zoneId)) return;

    // Calculate center of zone in iso coords
    const centerX = originX + width / 2;
    const centerY = originY + height / 2;
    const isoCenter = cartToIso(centerX, centerY);

    // Zone pixel bounds (approximate)
    const zonePixelW = width * TILE_W;
    const zonePixelH = height * TILE_H * 1.5;

    const emitters = [];

    if (biome === 'autumn_town') {
      // Falling leaves — gentle drift down-right
      for (let i = 0; i < 4; i++) {
        const emitter = this.add.particles(
          isoCenter.x + (Math.random() - 0.5) * zonePixelW * 0.8,
          isoCenter.y - zonePixelH * 0.4,
          `leaf_${i}`, {
          x: { min: -zonePixelW * 0.5, max: zonePixelW * 0.5 },
          speed: { min: 15, max: 35 },
          angle: { min: 100, max: 140 },  // falling down and slightly right
          rotate: { min: 0, max: 360 },
          scale: { start: 0.8, end: 0.4 },
          alpha: { start: 0.8, end: 0.2 },
          lifespan: { min: 4000, max: 7000 },
          frequency: 300,
          quantity: 1,
          gravityY: 8,
        });
        emitter.setDepth(9998);
        emitters.push(emitter);
      }
    }

    if (biome === 'winter_town') {
      // Snowflakes — gentle drift down
      const snowKeys = ['snowflake_s', 'snowflake_m', 'snowflake_l'];
      snowKeys.forEach((key, i) => {
        const emitter = this.add.particles(
          isoCenter.x,
          isoCenter.y - zonePixelH * 0.5,
          key, {
          x: { min: -zonePixelW * 0.6, max: zonePixelW * 0.6 },
          speed: { min: 8 + i * 5, max: 20 + i * 8 },
          angle: { min: 85, max: 95 },  // mostly straight down
          scale: { start: 0.6 + i * 0.2, end: 0.2 },
          alpha: { start: 0.9 - i * 0.1, end: 0.1 },
          lifespan: { min: 5000, max: 9000 },
          frequency: 200 - i * 50,
          quantity: 1,
          gravityY: 3 + i * 2,
        });
        emitter.setDepth(9998);
        emitters.push(emitter);
      });
    }

    if (biome === 'wilderness') {
      // Light rain — diagonal streaks
      const emitter = this.add.particles(
        isoCenter.x,
        isoCenter.y - zonePixelH * 0.5,
        'raindrop', {
        x: { min: -zonePixelW * 0.6, max: zonePixelW * 0.6 },
        speed: { min: 80, max: 150 },
        angle: { min: 100, max: 110 },  // diagonal fall
        scale: { start: 1.0, end: 0.5 },
        alpha: { start: 0.5, end: 0.1 },
        lifespan: { min: 1500, max: 2500 },
        frequency: 40,
        quantity: 2,
        gravityY: 50,
      });
      emitter.setDepth(9998);
      emitters.push(emitter);
    }

    if (biome === 'industrial') {
      // Haze / smog drifting
      const emitter = this.add.particles(
        isoCenter.x,
        isoCenter.y,
        'haze', {
        x: { min: -zonePixelW * 0.4, max: zonePixelW * 0.4 },
        y: { min: -zonePixelH * 0.3, max: zonePixelH * 0.3 },
        speed: { min: 3, max: 10 },
        angle: { min: 170, max: 190 },  // drifting right
        scale: { start: 1.5, end: 3.0 },
        alpha: { start: 0.15, end: 0 },
        lifespan: { min: 6000, max: 10000 },
        frequency: 500,
        quantity: 1,
      });
      emitter.setDepth(9998);
      emitters.push(emitter);
    }

    if (biome === 'highlands') {
      // Wind particles — fast horizontal wisps
      const g3 = this.make.graphics({ add: false });
      g3.fillStyle(0xffffff, 0.15);
      g3.fillRect(0, 0, 12, 1);
      g3.fillRect(2, 1, 8, 1);
      g3.generateTexture('wind_wisp', 12, 2);
      g3.destroy();

      const emitter = this.add.particles(
        isoCenter.x - zonePixelW * 0.5,
        isoCenter.y,
        'wind_wisp', {
        y: { min: -zonePixelH * 0.4, max: zonePixelH * 0.4 },
        speed: { min: 60, max: 120 },
        angle: { min: -5, max: 5 },  // horizontal
        scale: { start: 1.0, end: 0.3 },
        alpha: { start: 0.2, end: 0 },
        lifespan: { min: 3000, max: 5000 },
        frequency: 400,
        quantity: 1,
      });
      emitter.setDepth(9998);
      emitters.push(emitter);
    }

    if (biome === 'village') {
      // Gentle floating particles — pollen/fireflies
      const g4 = this.make.graphics({ add: false });
      g4.fillStyle(0xf0e8a0, 0.4);
      g4.fillCircle(2, 2, 2);
      g4.fillStyle(0xfff8d0, 0.6);
      g4.fillCircle(2, 2, 1);
      g4.generateTexture('pollen', 5, 5);
      g4.destroy();

      const emitter = this.add.particles(
        isoCenter.x,
        isoCenter.y,
        'pollen', {
        x: { min: -zonePixelW * 0.4, max: zonePixelW * 0.4 },
        y: { min: -zonePixelH * 0.3, max: zonePixelH * 0.3 },
        speed: { min: 2, max: 8 },
        angle: { min: 0, max: 360 },
        scale: { start: 0.6, end: 0.2 },
        alpha: { start: 0.5, end: 0 },
        lifespan: { min: 4000, max: 8000 },
        frequency: 600,
        quantity: 1,
      });
      emitter.setDepth(9998);
      emitters.push(emitter);
    }

    if (biome === 'farmland') {
      // Dust motes — warm golden particles
      const g5 = this.make.graphics({ add: false });
      g5.fillStyle(0xd4b060, 0.3);
      g5.fillCircle(2, 2, 2);
      g5.generateTexture('dust', 5, 5);
      g5.destroy();

      const emitter = this.add.particles(
        isoCenter.x,
        isoCenter.y + zonePixelH * 0.1,
        'dust', {
        x: { min: -zonePixelW * 0.4, max: zonePixelW * 0.4 },
        y: { min: -zonePixelH * 0.2, max: zonePixelH * 0.2 },
        speed: { min: 3, max: 12 },
        angle: { min: 250, max: 290 },  // rising
        scale: { start: 0.5, end: 0.1 },
        alpha: { start: 0.3, end: 0 },
        lifespan: { min: 3000, max: 6000 },
        frequency: 500,
        quantity: 1,
      });
      emitter.setDepth(9998);
      emitters.push(emitter);
    }

    if (emitters.length > 0) {
      this.weatherEmitters.set(zoneId, emitters);
    }
  }

  updateAgents(agents) {
    const activeIds = new Set();

    for (const agent of agents) {
      activeIds.add(agent.id);
      const iso = cartToIso(agent.x, agent.y);
      const targetX = iso.x;
      const targetY = iso.y - 16; // offset up so agents stand on tiles

      if (this.agentSprites.has(agent.id)) {
        // Update existing — smooth tween + walk animation
        const sprite = this.agentSprites.get(agent.id);
        const oldX = sprite.container.x;
        const oldY = sprite.container.y;
        const isMoving = Math.abs(targetX - oldX) > 2 || Math.abs(targetY - oldY) > 2;

        this.tweens.add({
          targets: sprite.container,
          x: targetX,
          y: targetY,
          duration: 800,
          ease: 'Sine.easeInOut',
          onComplete: () => {
            // Stop walk animation when arrived
            if (sprite.body.anims) {
              const variant = sprite._variant;
              sprite.body.play(`agent_v${variant}_south_idle`, true);
            }
          },
        });

        // Play walk animation while moving
        if (isMoving && sprite.body.anims) {
          const variant = sprite._variant;
          // Determine direction based on movement
          const dx = targetX - oldX;
          const dy = targetY - oldY;
          let dir = 'south';
          if (Math.abs(dx) > Math.abs(dy)) {
            dir = dx > 0 ? 'east' : 'west';
          } else {
            dir = dy > 0 ? 'south' : 'north';
          }
          sprite.body.play(`agent_v${variant}_${dir}_walk`, true);
        }

        sprite.container.setDepth(agent.x + agent.y + 1);
        const displayName = agent.guildTag ? `[${agent.guildTag}] ${agent.name}` : agent.name;
        sprite.nameText.setText(displayName);

        // Update HP bar
        if (sprite.hpBar && agent.hp !== undefined && agent.maxHp) {
          sprite.hpBar.clear();
          const hpPercent = Math.max(0, agent.hp / agent.maxHp);
          const hpColor = hpPercent > 0.5 ? 0x00ff44 : hpPercent > 0.25 ? 0xffcc00 : 0xff4444;
          sprite.hpBar.fillStyle(hpColor);
          sprite.hpBar.fillRect(-12, -36, Math.round(24 * hpPercent), 3);
        }
      } else {
        // Create new agent sprite from real spritesheet
        // Pick variant based on agent wallet hash (0-7)
        const variant = Math.abs(hashCode(agent.wallet || agent.id)) % 8;
        // Start frame: variant row * 16 cols + south idle (frame 0)
        const startFrame = variant * 16;

        const container = this.add.container(targetX, targetY);

        const body = this.add.sprite(0, 0, 'agents', startFrame);
        body.setScale(1.2);
        body._variant = variant;

        // Play idle animation
        body.play(`agent_v${variant}_south_idle`);

        // HP bar background
        const hpBarBg = this.add.graphics();
        hpBarBg.fillStyle(0x333333, 0.8);
        hpBarBg.fillRect(-12, -36, 24, 3);

        // HP bar fill
        const hpBar = this.add.graphics();
        hpBar.fillStyle(0x00ff44);
        hpBar.fillRect(-12, -36, 24, 3);

        // Name tag (with guild tag if present)
        const displayName = agent.guildTag ? `[${agent.guildTag}] ${agent.name}` : agent.name;
        const nameText = this.add.text(0, -42, displayName, {
          fontSize: '9px',
          fontFamily: 'Courier New',
          color: agent.guildTag ? '#ffcc00' : '#e0e0e0',
          stroke: '#0a0a1a',
          strokeThickness: 2,
        }).setOrigin(0.5);

        // Status indicator
        const statusDot = this.add.graphics();
        statusDot.fillStyle(agent.status === 'active' ? 0x00ff88 : 0xff4444);
        statusDot.fillCircle(16, -42, 2);

        container.add([body, hpBarBg, hpBar, nameText, statusDot]);
        container.setDepth(agent.x + agent.y + 1);
        container.setSize(32, 48);
        container.setInteractive();

        const newSprite = { container, body, nameText, statusDot, hpBar, hpBarBg, _variant: variant };
        this.agentSprites.set(agent.id, newSprite);
      }
    }

    // Remove sprites for agents that are gone
    for (const [agentId, sprite] of this.agentSprites) {
      if (!activeIds.has(agentId)) {
        sprite.container.destroy();
        this.agentSprites.delete(agentId);
      }
    }

    // Update HUD agent list
    updateAgentList(agents);

    // Follow camera
    if (this.followingAgent && this.agentSprites.has(this.followingAgent)) {
      const sprite = this.agentSprites.get(this.followingAgent);
      this.cameras.main.centerOn(sprite.container.x, sprite.container.y);
    }
  }

  updateBuildings(buildings) {
    for (const b of buildings) {
      this.addBuildingSprite(b.id, b.type, b.x, b.y, b.appearance);
    }
  }

  updateResources(resources) {
    // Clear old resource sprites
    for (const [key, sprite] of this.resourceSprites) {
      sprite.destroy();
    }
    this.resourceSprites.clear();

    for (const res of resources) {
      const key = `${res.x},${res.y}`;
      const texKey = `res_${res.type}`;
      if (!this.textures.exists(texKey)) continue;

      const iso = cartToIso(res.x, res.y);
      const sprite = this.add.image(iso.x, iso.y - 2, texKey);
      sprite.setOrigin(0.5, 0.8);
      sprite.setDepth(res.x + res.y + 0.2);
      sprite.setScale(1.0);
      sprite.setAlpha(0.8);

      this.resourceSprites.set(key, sprite);
    }

    document.getElementById('hud-resources').textContent = this.resourceSprites.size;
  }

  addBuildingSprite(id, type, tileX, tileY, appearance) {
    if (this.buildingSprites.has(id)) return;

    const iso = cartToIso(tileX, tileY);
    const level = (appearance && appearance.level) || 1;
    const texKey = `${type}_level${level}`;

    // Check if the real building texture exists, fall back to level 1
    const finalKey = this.textures.exists(texKey) ? texKey : `${type}_level1`;
    if (!this.textures.exists(finalKey)) return;

    const sprite = this.add.image(iso.x, iso.y - 20, finalKey);
    sprite.setOrigin(0.5, 0.8);
    sprite.setDepth(tileX + tileY + 0.8);

    this.buildingSprites.set(id, sprite);

    // Animated smoke for buildings with chimneys
    if (type === 'home' || type === 'headquarters') {
      this.addSmoke(iso.x + 8, iso.y - sprite.height * 0.6);
    }

    document.getElementById('hud-buildings').textContent = this.buildingSprites.size;
  }

  addSmoke(x, y) {
    if (!this.textures.exists('smoke')) return;

    // Use animated smoke if available
    const hasAnim = this.anims.exists('smoke_anim');

    const particles = this.add.particles(x, y, 'smoke', {
      speed: { min: 5, max: 15 },
      angle: { min: 250, max: 290 },
      scale: { start: 0.5, end: 0 },
      alpha: { start: 0.4, end: 0 },
      lifespan: 2500,
      frequency: 700,
      quantity: 1,
      ...(hasAnim ? { anim: 'smoke_anim' } : {}),
    });
    particles.setDepth(9999);
  }

  showSpeechBubble(agentId, message) {
    if (!this.agentSprites.has(agentId)) return;
    const sprite = this.agentSprites.get(agentId);

    const bubble = this.add.text(
      sprite.container.x, sprite.container.y - 26,
      message.slice(0, 40) + (message.length > 40 ? '...' : ''),
      {
        fontSize: '8px',
        fontFamily: 'Courier New',
        color: '#fae080',
        backgroundColor: 'rgba(10,10,26,0.8)',
        padding: { x: 4, y: 2 },
        stroke: '#0a0a1a',
        strokeThickness: 1,
      }
    ).setOrigin(0.5).setDepth(10000);

    this.tweens.add({
      targets: bubble,
      y: bubble.y - 10,
      alpha: 0,
      duration: 3000,
      ease: 'Sine.easeIn',
      onComplete: () => bubble.destroy(),
    });
  }

  spawnDemoAgents() {
    // Offline demo — fake agents for preview
    setStatus('disconnected', 'Demo Mode');
    addEventLog('Running in demo mode (no server connected)', 'action', 0);

    const demoAgents = [
      { id: 'demo1', name: 'Explorer', x: 14, y: 16, status: 'active' },
      { id: 'demo2', name: 'Trader', x: 18, y: 15, status: 'active' },
      { id: 'demo3', name: 'Builder', x: 16, y: 18, status: 'active' },
      { id: 'demo4', name: 'Scholar', x: 12, y: 14, status: 'active' },
      { id: 'demo5', name: 'Scout', x: 20, y: 20, status: 'active' },
    ];

    this.updateAgents(demoAgents);
    document.getElementById('hud-agents').textContent = demoAgents.length;

    // Animate demo agents
    const moveAgent = () => {
      const updated = demoAgents.map(a => ({
        ...a,
        x: a.x + Math.floor(Math.random() * 3) - 1,
        y: a.y + Math.floor(Math.random() * 3) - 1,
      }));
      demoAgents.forEach((a, i) => { a.x = updated[i].x; a.y = updated[i].y; });
      this.updateAgents(demoAgents);

      // Random speech
      if (Math.random() < 0.3) {
        const speaker = demoAgents[Math.floor(Math.random() * demoAgents.length)];
        const msgs = ['Hello!', 'Nice zone.', 'Anyone trading?', 'Building time.', 'Exploring...'];
        const msg = msgs[Math.floor(Math.random() * msgs.length)];
        this.showSpeechBubble(speaker.id, msg);
        addEventLog(`💬 ${speaker.name}: "${msg}"`, 'speech', this.worldData.tick++);
      }
    };

    this.time.addEvent({ delay: 1500, callback: moveAgent, loop: true });

    // Demo buildings
    setTimeout(() => {
      this.addBuildingSprite('b1', 'home', 10, 12);
      this.addBuildingSprite('b2', 'shop', 20, 14);
      this.addBuildingSprite('b3', 'headquarters', 16, 10);
      addEventLog('🏠 Buildings placed in demo', 'build', 0);
    }, 2000);
  }

  updateHUD(stats) {
    if (stats.tick !== undefined) document.getElementById('hud-tick').textContent = stats.tick;
    if (stats.agents !== undefined) document.getElementById('hud-agents').textContent = stats.agents;
    if (stats.zones !== undefined) document.getElementById('hud-zones').textContent = stats.zones;
    if (stats.buildings !== undefined) document.getElementById('hud-buildings').textContent = stats.buildings;
  }

  update() {
    // Depth sort all agents based on position

      // Already handled by setDepth in updateAgents
    }
  }
}

// ==================== HELPERS ====================

function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return hash;
}

function setStatus(state, text) {
  const dot = document.getElementById('status-dot');
  dot.className = `status-dot ${state}`;
  document.getElementById('status-text').textContent = text;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function updateAgentList(agents) {
  const list = document.getElementById('agent-list');
  list.innerHTML = agents.map(a =>
    `<div class="agent-entry"><span class="name">${escapeHtml(a.name)}</span> <span class="pos">(${a.x}, ${a.y})</span></div>`
  ).join('');
}

function addEventLog(message, type, tick) {
  const events = document.getElementById('events');
  const entry = document.createElement('div');
  entry.className = 'event-entry';
  entry.innerHTML = `<span class="tick">[${tick}]</span> <span class="${type}">${escapeHtml(message)}</span>`;
  events.prepend(entry);

  // Keep only last 50 events
  while (events.children.length > 50) {
    events.removeChild(events.lastChild);
  }
}

// ==================== TOAST NOTIFICATIONS ====================

function showToast(message, type = '') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.prepend(toast);
  setTimeout(() => toast.remove(), 4000);
  // Keep max 5 toasts
  while (container.children.length > 5) container.removeChild(container.lastChild);
}

// ==================== MINIMAP ====================

function updateMinimap(zones, agents, buildings) {
  const canvas = document.getElementById('minimap');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, w, h);

  // Find world bounds
  let minX = 0, minY = 0, maxX = 32, maxY = 32;
  for (const z of (zones || [])) {
    minX = Math.min(minX, z.originX);
    minY = Math.min(minY, z.originY);
    maxX = Math.max(maxX, z.originX + z.width);
    maxY = Math.max(maxY, z.originY + z.height);
  }
  const worldW = maxX - minX || 32;
  const worldH = maxY - minY || 32;
  const scale = Math.min(w / worldW, h / worldH);

  // Draw zones
  const biomeColors = {
    village: '#2a4a2a', autumn_town: '#4a3a1a', farmland: '#3a4a1a',
    industrial: '#3a3a3a', wilderness: '#1a3a1a', highlands: '#4a4a3a', winter_town: '#3a4a5a',
  };
  for (const z of (zones || [])) {
    ctx.fillStyle = biomeColors[z.biome] || '#222';
    ctx.fillRect((z.originX - minX) * scale, (z.originY - minY) * scale, z.width * scale, z.height * scale);
    ctx.strokeStyle = 'rgba(0,212,255,0.2)';
    ctx.strokeRect((z.originX - minX) * scale, (z.originY - minY) * scale, z.width * scale, z.height * scale);
  }

  // Draw buildings
  ctx.fillStyle = '#aa8844';
  for (const b of (buildings || [])) {
    ctx.fillRect((b.x - minX) * scale - 1, (b.y - minY) * scale - 1, 3, 3);
  }

  // Draw agents
  ctx.fillStyle = '#00ff88';
  for (const a of (agents || [])) {
    ctx.beginPath();
    ctx.arc((a.x - minX) * scale, (a.y - minY) * scale, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Minimap click-to-navigate
document.getElementById('minimap')?.addEventListener('click', (e) => {
  const canvas = e.target;
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;

  // Reverse the minimap scale to get world coords
  const scene = game?.scene?.scenes?.[0];
  if (!scene?.worldData?.zones) return;

  let minX = 0, minY = 0, maxX = 32, maxY = 32;
  for (const z of scene.worldData.zones) {
    minX = Math.min(minX, z.originX);
    minY = Math.min(minY, z.originY);
    maxX = Math.max(maxX, z.originX + z.width);
    maxY = Math.max(maxY, z.originY + z.height);
  }
  const worldW = maxX - minX || 32;
  const worldH = maxY - minY || 32;
  const scale = Math.min(canvas.width / worldW, canvas.height / worldH);

  const tileX = minX + cx / scale;
  const tileY = minY + cy / scale;
  const iso = cartToIso(tileX, tileY);
  scene.cameras.main.centerOn(iso.x, iso.y);
  scene.followingAgent = null;
});

// Agent hover tooltip — attach after game initializes
setTimeout(() => {
  const gameCanvas = document.querySelector('#game-container canvas');
  if (!gameCanvas) return;

  gameCanvas.addEventListener('mousemove', (e) => {
    const scene = game?.scene?.scenes?.[0];
    if (!scene) return;

    const worldPoint = scene.cameras.main.getWorldPoint(e.offsetX, e.offsetY);
    let found = false;

    for (const [agentId, sprite] of scene.agentSprites) {
      const bounds = sprite.container.getBounds();
      if (bounds.contains(worldPoint.x, worldPoint.y)) {
        const agentData = scene.worldData.agents.find(a => a.id === agentId) || {};
        showAgentTooltip(agentData, e.clientX, e.clientY);
        found = true;
        break;
      }
    }
    if (!found) hideAgentTooltip();
  });
}, 2000);

// ==================== SOUND EFFECTS ====================

let soundEnabled = false;
let audioCtx = null;

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('sound-toggle');
  btn.className = soundEnabled ? 'on' : '';
  btn.innerHTML = soundEnabled ? '&#128266;' : '&#128264;';
  if (soundEnabled && !audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playSound(type) {
  if (!soundEnabled || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  switch (type) {
    case 'speak':
      osc.frequency.value = 440;
      osc.type = 'sine';
      gain.gain.value = 0.08;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.stop(audioCtx.currentTime + 0.15);
      break;
    case 'join':
      osc.frequency.value = 523;
      osc.type = 'sine';
      gain.gain.value = 0.1;
      osc.start();
      osc.frequency.exponentialRampToValueAtTime(659, audioCtx.currentTime + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      osc.stop(audioCtx.currentTime + 0.2);
      break;
    case 'combat':
      osc.frequency.value = 200;
      osc.type = 'sawtooth';
      gain.gain.value = 0.1;
      osc.start();
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      osc.stop(audioCtx.currentTime + 0.2);
      break;
    case 'build':
      osc.frequency.value = 330;
      osc.type = 'triangle';
      gain.gain.value = 0.08;
      osc.start();
      osc.frequency.setValueAtTime(392, audioCtx.currentTime + 0.08);
      osc.frequency.setValueAtTime(523, audioCtx.currentTime + 0.16);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.stop(audioCtx.currentTime + 0.25);
      break;
    case 'event':
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.value = 0.12;
      osc.start();
      osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      osc.stop(audioCtx.currentTime + 0.4);
      break;
  }
}
